# Local development only. Production hosting settings are in render.yaml / DEPLOY.md.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the Compose db service using your URL-encoded password}"
      DEBUG: "true"
      INSTITUTIONAL_EMAIL_DOMAIN: du.ac.bd
      EXPOSE_VERIFICATION_TOKEN_IN_RESPONSE: "true"
      MEDIA_ROOT: /app/uploads
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dain
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a unique local database password}"
      POSTGRES_USER: dain_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data:
