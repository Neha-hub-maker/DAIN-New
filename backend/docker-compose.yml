services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_started
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+psycopg://dain_user:DainDB_2026!StrongPass@db:5432/dain"
      DEBUG: "true"
      INSTITUTIONAL_EMAIL_DOMAIN: du.ac.bd
      EXPOSE_VERIFICATION_TOKEN_IN_RESPONSE: "true"
      MEDIA_ROOT: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dain
      POSTGRES_PASSWORD: DainDB_2026!StrongPass
      POSTGRES_USER: dain_user
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data:
    