services:
  - type: web
    name: dain-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Run migrations on every deploy, including plans without pre-deploy commands.
    startCommand: python -m alembic upgrade head && python -m app.db.seed && exec python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --proxy-headers --forwarded-allow-ips "${FORWARDED_ALLOW_IPS:?Configure trusted proxy IPs or CIDRs in the dashboard}"
    healthCheckPath: /health
    envVars:
      # psycopg-binary 3.2.3 has no Python 3.14 wheels. Match backend/Dockerfile.
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: EXPOSE_VERIFICATION_TOKEN_IN_RESPONSE
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Used by local Compose only; not needed by the Render API process.
      - key: POSTGRES_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Trust only the host ingress proxy IPs/CIDRs; obtain them from the host.
      - key: FORWARDED_ALLOW_IPS
        sync: false
      - key: INSTITUTIONAL_EMAIL_DOMAIN
        value: du.ac.bd
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TAVILY_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
      - key: VERIFICATION_TOKEN_TTL_MINUTES
        value: "60"
      - key: SESSION_TOKEN_TTL_MINUTES
        value: "1440"
      - key: MEDIA_ROOT
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "5242880"
    # Uploaded media must survive deploys; attaching a disk requires a paid plan.
    disk:
      name: dain-media
      mountPath: /var/data
      sizeGB: 1
